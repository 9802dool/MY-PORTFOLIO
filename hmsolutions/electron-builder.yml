# electron-builder: Windows NSIS .exe installer + macOS .dmg
# Build Windows installers on Windows/Linux (with wine); build .dmg on macOS.
# See: https://www.electron.build/configuration/configuration

appId: com.hmsolutions.inventory
productName: HM Solutions Inventory
copyright: Copyright © HM Solutions

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true
# better-sqlite3 ships .node binaries; load them outside the asar archive
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.business
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Set to true when code-signing for notarization (requires Apple Developer ID)
  hardenedRuntime: false

# DMG layout uses defaults (drag app to Applications). Disable DMG signing when no Apple cert.
dmg:
  sign: false
